<title>Dalliance prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: '#161616', raised: '#1E1E1E', hover: '#262626', edge: '#2A2A2A',
          ink: '#E8E8E8', muted: '#9E9E9E', faint: '#666666',
          go: '#4CC764', warn: '#E9B04A'
        },
        fontFamily: {
          sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace']
        }
      }
    }
  }
</script>
<style>
  /* Deliberately single-theme: a dark desktop app. */
  :root { color-scheme: dark; --s-starter: #5FB3B3; --s-pro: #E8793B; --s-team: #8E8EEA; }
  html, body { height: 100%; }
  body { background: #161616; color: #E8E8E8; font-family: Inter, ui-sans-serif, system-ui, sans-serif; font-feature-settings: "cv11", "ss01"; overflow: hidden; }
  .tnum { font-variant-numeric: tabular-nums; }
  .ref { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 0.86em; color: #D7A2F0; white-space: nowrap; }
  .scroll::-webkit-scrollbar { width: 10px; height: 10px; }
  .scroll::-webkit-scrollbar-thumb { background: #2E2E2E; border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
  .scroll::-webkit-scrollbar-track { background: transparent; }
  .spin { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  :focus-visible { outline: 2px solid #5A5A5A; outline-offset: 2px; border-radius: 6px; }

  /* Transparent textarea over a mirror, so @references are coloured while typing */
  .ed pre, .ed textarea { margin: 0; padding: 0; border: 0; font: inherit; letter-spacing: inherit; white-space: pre-wrap; overflow-wrap: anywhere; background: transparent; }
  .ed pre { min-height: 1.6em; color: #E8E8E8; }
  .ed textarea { position: absolute; inset: 0; width: 100%; height: 100%; color: transparent; caret-color: #E8E8E8; resize: none; overflow: hidden; outline: none; }
  .ed textarea::placeholder { color: #5E5E5E; }
  .ed textarea::selection { background: rgba(255, 255, 255, .16); color: transparent; }
  .ed .r { color: #D7A2F0; }

  .cell .selbar { background: transparent; }
  .cell.sel .selbar, .cell:focus-within .selbar { background: #4A4A4A; }
  .codeed { display: block; min-width: max-content; outline: none; }
  .val { color: #E8E8E8; border-bottom: 1px dashed #5A5A5A; cursor: text; }
  .val:hover { border-bottom-color: #9E9E9E; }
  .val[contenteditable="true"] { outline: none; border-bottom: 1px solid #E8E8E8; }
  pre code .k { color: #C792EA; }
  pre code .s { color: #9FD39B; }
  pre code .n { color: #7FD1A0; }
  pre code .f { color: #7AB8F5; }
  pre code .c { color: #666666; font-style: italic; }
  .chart text { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 11px; }
</style>

<div class="flex h-full flex-col">

  <!-- Top bar -->
  <header class="flex h-12 shrink-0 items-center gap-2 border-b border-edge px-3 text-[13.5px]">
    <button id="sidebarToggle" class="rounded-md p-1.5 text-muted hover:bg-hover hover:text-ink" aria-label="Toggle outline" aria-expanded="false">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="4.5" width="17" height="15" rx="3"/><path d="M9.5 5v14"/></svg>
    </button>
    <span class="truncate font-medium text-ink">Churn review, Q3 2026</span>
    <span class="hidden items-center gap-1.5 text-faint sm:flex">
      <span id="kernelDot" class="h-1.5 w-1.5 rounded-full bg-go"></span>
      <span id="kernelState">Python 3.12 · idle</span>
    </span>
    <div class="ml-auto flex items-center gap-1">
      <button id="stopBtn" class="hidden rounded-md px-2.5 py-1 text-muted hover:bg-hover hover:text-ink">Stop</button>
      <button id="restartBtn" class="rounded-md p-1.5 text-muted hover:bg-hover hover:text-ink" aria-label="Restart kernel" title="Restart kernel">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg>
      </button>
      <button id="runAllBtn" class="flex items-center gap-1.5 rounded-md bg-hover px-2.5 py-1 text-ink hover:bg-[#303030]">
        <svg class="text-go" width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4v16l14-8z"/></svg>Run all
      </button>
    </div>
  </header>

  <div class="relative flex min-h-0 flex-1">

    <!-- Outline (hidden by default) -->
    <aside id="sidebar" class="scroll absolute inset-y-0 left-0 z-30 hidden w-64 shrink-0 flex-col gap-6 overflow-y-auto border-r border-edge bg-bg px-3 py-4 md:static">
      <div>
        <div class="px-2 pb-1.5 text-[12px] text-faint">Cells</div>
        <ol id="outline" class="flex flex-col text-[13px]"></ol>
      </div>
      <div>
        <div class="px-2 pb-1.5 text-[12px] text-faint">Variables</div>
        <ul id="vars" class="flex flex-col font-mono text-[12px]"></ul>
      </div>
    </aside>

    <!-- Notebook -->
    <main id="scroller" class="scroll relative min-w-0 flex-1 overflow-y-auto">
      <div class="mx-auto max-w-[720px] px-3 pb-32 pt-8 sm:px-6">
        <div id="cells" class="flex flex-col"></div>
        <button id="appendBtn" class="ml-11 mt-2 flex items-center gap-1.5 rounded-md px-2 py-1 text-[13px] text-faint hover:bg-hover hover:text-ink">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>Add cell
        </button>
      </div>
    </main>

    <div id="toast" class="pointer-events-none absolute bottom-5 left-1/2 z-40 flex -translate-x-1/2 items-center gap-3 rounded-lg bg-[#2A2A2A] px-3.5 py-2 text-[13px] text-ink opacity-0 shadow-xl transition-opacity"></div>
  </div>
</div>

<script>
(function () {
  var I = {
    play: '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4v16l14-8z"/></svg>',
    up: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M6 11l6-6 6 6"/></svg>',
    down: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M6 13l6 6 6-6"/></svg>',
    trash: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
    plus: '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>',
    spin: '<svg class="spin shrink-0" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 3a9 9 0 1 0 9 9" stroke-linecap="round"/></svg>'
  };

  // ============ Canned outputs (the kernel is simulated in this draft) ============
  var TH = 'border-b border-edge text-[11.5px] text-faint';
  var TD = 'py-1.5 pr-4';
  var OUT = {
    load: {
      secs: '3.1s', creates: { subs: '48,213 × 14', events: '1.21M × 6' },
      views: [{ name: 'Result', html: `
        <p class="mb-3 text-[13.5px] text-muted"><span class="ref">subs</span> <span class="tnum">48,213 × 14</span>, <span class="ref">events</span> <span class="tnum">1,208,540 × 6</span>. Four columns have gaps:</p>
        <div class="scroll overflow-x-auto">
          <table class="tnum w-full min-w-[420px] text-left text-[13px]">
            <thead class="${TH}"><tr><th class="${TD} font-normal">Column</th><th class="${TD} text-right font-normal">Missing</th><th class="py-1.5 font-normal">Note</th></tr></thead>
            <tbody class="divide-y divide-edge">
              <tr><td class="${TD} font-mono text-[12.5px]">cancelled_at</td><td class="${TD} text-right">71.4%</td><td class="py-1.5 text-muted">Expected: active subscriptions</td></tr>
              <tr><td class="${TD} font-mono text-[12.5px]">coupon_code</td><td class="${TD} text-right">88.0%</td><td class="py-1.5 text-muted">Expected: most have none</td></tr>
              <tr><td class="${TD} font-mono text-[12.5px]">company_size</td><td class="${TD} text-right text-warn">6.2%</td><td class="py-1.5 text-warn">May bias splits by size</td></tr>
              <tr><td class="${TD} font-mono text-[12.5px]">country</td><td class="${TD} text-right">0.3%</td><td class="py-1.5 text-muted">Negligible</td></tr>
            </tbody>
          </table>
        </div>` }],
      code: `<span class="k">import</span> pandas <span class="k">as</span> pd
subs = pd.<span class="f">read_csv</span>(<span class="s">'subscriptions.csv'</span>, parse_dates=[<span class="s">'started_at'</span>, <span class="s">'cancelled_at'</span>])
events = warehouse.<span class="f">read</span>(<span class="s">'analytics.events'</span>)

missing = subs.<span class="f">isna</span>().<span class="f">mean</span>().<span class="f">mul</span>(<span class="n">100</span>).<span class="f">round</span>(<span class="n">1</span>)
missing[missing &gt; <span class="n">0</span>].<span class="f">sort_values</span>(ascending=<span class="k">False</span>)`
    },
    churn: {
      secs: '1.8s', creates: { churn_by_plan: '6 × 3' },
      views: [
        { name: 'Chart', html: `
          <div class="mb-1 flex flex-wrap gap-3 text-[12px] text-muted">
            <span class="flex items-center gap-1.5"><span class="h-0.5 w-3 rounded" style="background:var(--s-starter)"></span>Starter</span>
            <span class="flex items-center gap-1.5"><span class="h-0.5 w-3 rounded" style="background:var(--s-pro)"></span>Pro</span>
            <span class="flex items-center gap-1.5"><span class="h-0.5 w-3 rounded" style="background:var(--s-team)"></span>Team</span>
          </div>
          <div class="scroll overflow-x-auto"><svg class="churnChart chart block w-full min-w-[420px]" viewBox="0 0 620 220" role="img" aria-label="Monthly churn by plan, April to September 2026. Pro spikes to 3.8% in August."></svg></div>` },
        { name: 'Table', html: '<div class="scroll overflow-x-auto"><table class="churnTable tnum w-full min-w-[340px] text-right text-[13px]"></table></div>' }
      ],
      after: drawChurn,
      code: `subs[<span class="s">'churned'</span>] = subs.cancelled_at.<span class="f">notna</span>() &amp; ~subs.<span class="f">reactivated_within</span>(days=<span class="n">14</span>)
window = subs[subs.period.<span class="f">between</span>(<span class="s">'2026-04'</span>, <span class="s">'2026-09'</span>)]

churn_by_plan = (
    window.<span class="f">groupby</span>([<span class="s">'period'</span>, <span class="s">'plan'</span>])
          .<span class="f">apply</span>(<span class="k">lambda</span> g: g.churned.<span class="f">sum</span>() / g.active_at_start.<span class="f">sum</span>())
          .<span class="f">unstack</span>(<span class="s">'plan'</span>).<span class="f">mul</span>(<span class="n">100</span>).<span class="f">round</span>(<span class="n">1</span>)
)`
    },
    why: {
      secs: '4.2s', creates: { aug_pro_cancels: '257 × 9' },
      views: [{ name: 'Answer', html: `
        <p class="max-w-[62ch] text-[14.5px] leading-[1.65] text-ink">The spike comes from Pro accounts on monthly billing after the Aug 4 price change. Annual accounts were not affected.</p>
        <ul class="mt-2 flex max-w-[62ch] flex-col gap-1 text-[14px] leading-[1.6] text-muted">
          <li class="flex gap-3"><span class="text-faint">•</span><span><span class="tnum text-ink">142 of 257</span> August cancellations (55%) gave price as the reason, up from 21% in July.</span></li>
          <li class="flex gap-3"><span class="text-faint">•</span><span>Monthly Pro churn went from <span class="tnum text-ink">2.8%</span> to <span class="tnum text-ink">5.6%</span>. Annual held at <span class="tnum text-ink">1.9%</span>.</span></li>
          <li class="flex gap-3"><span class="text-faint">•</span><span>It fell back to <span class="tnum text-ink">2.6%</span> in September, after the Aug 26 grandfathering email.</span></li>
        </ul>
        <div class="reasonBars mt-4 flex max-w-[480px] flex-col gap-1.5 text-[13px]"></div>` }],
      after: drawBars,
      code: `aug_pro_cancels = subs.<span class="f">query</span>(<span class="s">"plan == 'Pro' and cancelled_at.dt.month == 8"</span>)
aug_pro_cancels.cancel_reason.<span class="f">value_counts</span>()

<span class="c"># Churn by billing cycle, July vs August</span>
subs.<span class="f">query</span>(<span class="s">"plan == 'Pro'"</span>).<span class="f">pivot_table</span>(
    index=<span class="s">'billing_cycle'</span>, columns=<span class="s">'period'</span>, values=<span class="s">'churned'</span>, aggfunc=<span class="s">'mean'</span>
).loc[:, [<span class="s">'2026-07'</span>, <span class="s">'2026-08'</span>]]`
    },
    winback: {
      secs: '14.0s', creates: { winback_segment: '318 × 7' },
      views: [{ name: 'Result', html: `
        <p class="mb-3 text-[14.5px] leading-[1.65] text-ink"><span class="tnum">318</span> accounts match. Most downgraded within 10 days of the change.</p>
        <div class="scroll overflow-x-auto"><table class="tnum w-full min-w-[420px] text-left text-[13px]"><thead class="${TH}"><tr><th class="${TD} font-normal">Account</th><th class="${TD} font-normal">Downgraded</th><th class="${TD} text-right font-normal">Seats</th><th class="py-1.5 text-right font-normal">Pro tenure</th></tr></thead>
        <tbody class="divide-y divide-edge"><tr><td class="${TD}">Halvorsen Studio</td><td class="${TD} text-muted">Aug 6</td><td class="${TD} text-right">12</td><td class="py-1.5 text-right">26 mo</td></tr><tr><td class="${TD}">Ridgeway Legal</td><td class="${TD} text-muted">Aug 7</td><td class="${TD} text-right">9</td><td class="py-1.5 text-right">14 mo</td></tr><tr><td class="${TD}">Kōan Ceramics</td><td class="${TD} text-muted">Aug 11</td><td class="${TD} text-right">4</td><td class="py-1.5 text-right">31 mo</td></tr></tbody></table></div>
        <p class="mt-2 text-[12.5px] text-faint">315 more rows</p>` }],
      code: `winback_segment = (
    events.<span class="f">query</span>(<span class="s">"type == 'plan_changed' and from_plan == 'Pro' and to_plan == 'Starter'"</span>)
          .<span class="f">query</span>(<span class="s">"at &gt;= '2026-08-04'"</span>)
          .<span class="f">merge</span>(subs.<span class="f">query</span>(<span class="s">"billing_cycle == 'monthly' and cancelled_at.isna()"</span>), on=<span class="s">'account_id'</span>)
          .<span class="f">query</span>(<span class="s">"last_login &gt;= '2026-08-27'"</span>)
)`
    }
  };

  function drawChurn(root) {
    var months = ['Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep'];
    var series = [
      { name: 'Starter', color: 'var(--s-starter)', data: [4.1, 4.3, 4.0, 4.2, 4.4, 4.1] },
      { name: 'Pro', color: 'var(--s-pro)', data: [2.2, 2.1, 2.3, 2.4, 3.8, 2.6] },
      { name: 'Team', color: 'var(--s-team)', data: [1.2, 1.1, 1.3, 1.2, 1.0, 1.1] }
    ];
    var W = 620, H = 220, L = 36, R = 80, T = 18, B = 28, yMax = 5, pw = W - L - R, ph = H - T - B;
    var x = function (i) { return L + i * (pw / 5); };
    var y = function (v) { return T + (1 - v / yMax) * ph; };
    var s = '';
    for (var t = 0; t <= yMax; t++) {
      s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(t) + '" y2="' + y(t) + '" stroke="#262626"/>';
      s += '<text x="' + (L - 8) + '" y="' + (y(t) + 4) + '" text-anchor="end" fill="#666">' + t + '%</text>';
    }
    months.forEach(function (m, i) { s += '<text x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle" fill="#666">' + m + '</text>'; });
    var px = x(3) + (x(4) - x(3)) * 0.12;
    s += '<line x1="' + px + '" x2="' + px + '" y1="' + T + '" y2="' + (H - B) + '" stroke="#555" stroke-dasharray="3 3"/>';
    s += '<text x="' + (px - 6) + '" y="' + (T + 8) + '" text-anchor="end" fill="#777">price change</text>';
    series.forEach(function (se) {
      var pro = se.name === 'Pro';
      s += '<polyline points="' + se.data.map(function (v, i) { return x(i) + ',' + y(v); }).join(' ') + '" fill="none" stroke="' + se.color + '" stroke-width="' + (pro ? 2 : 1.5) + '" stroke-linejoin="round" stroke-linecap="round"' + (pro ? '' : ' opacity="0.7"') + '/>';
      if (pro) s += '<circle cx="' + x(4) + '" cy="' + y(3.8) + '" r="3.5" fill="' + se.color + '"/><text x="' + x(4) + '" y="' + (y(3.8) - 10) + '" text-anchor="middle" fill="' + se.color + '">3.8%</text>';
      s += '<text x="' + (W - R + 10) + '" y="' + (y(se.data[5]) + 4) + '" fill="' + se.color + '">' + se.name + '</text>';
    });
    root.querySelector('.churnChart').innerHTML = s;
    root.querySelector('.churnTable').innerHTML =
      '<thead class="' + TH + '"><tr><th class="py-1.5 text-left font-normal">Month</th>' + series.map(function (se) { return '<th class="py-1.5 pl-4 font-normal">' + se.name + '</th>'; }).join('') + '</tr></thead>' +
      '<tbody class="divide-y divide-edge">' + months.map(function (m, i) {
        return '<tr><td class="py-1.5 text-left text-muted">' + m + '</td>' + series.map(function (se) {
          var hot = se.name === 'Pro' && i === 4;
          return '<td class="py-1.5 pl-4"' + (hot ? ' style="color:var(--s-pro)"' : '') + '>' + se.data[i].toFixed(1) + '%</td>';
        }).join('') + '</tr>';
      }).join('') + '</tbody>';
  }
  function drawBars(root) {
    var reasons = [['Price increase', 142], ['Switched tools', 38], ['Missing feature', 31], ['Budget cut', 27], ['Other', 19]];
    root.querySelector('.reasonBars').innerHTML = '<div class="mb-1 text-[12px] text-faint">August Pro cancellations by stated reason</div>' + reasons.map(function (r, i) {
      return '<div class="grid grid-cols-[7.5rem_1fr_2rem] items-center gap-3">' +
        '<span class="truncate ' + (i ? 'text-muted' : 'text-ink') + '">' + r[0] + '</span>' +
        '<span class="h-1.5 rounded-full bg-[#232323]"><span class="block h-full rounded-full" style="width:' + (r[1] / 142 * 100) + '%;background:' + (i ? '#444' : 'var(--s-pro)') + '"></span></span>' +
        '<span class="tnum text-right font-mono text-[12px] text-faint">' + r[1] + '</span></div>';
    }).join('');
  }

  // ============ Model ============
  var uid = 0, execCount = 3, selId = null, stopFlag = false, lastD = 0;
  function mk(o) {
    o.id = 'c' + (++uid);
    o.state = o.state || 'idle';      // idle | running | done | dirty | stale
    o.count = o.count == null ? null : o.count;
    o.codeEdited = false; o.promptChanged = false; o.code = null; o.tab = 0; o.editing = !!o.editing;
    return o;
  }
  var cells = [
    mk({ kind: 'md', text: '# Churn review, Q3 2026\nPro went from $29 to $36 on Aug 4. Did the price change cause the August churn spike, and who should get a win-back offer?' }),
    mk({ kind: 'prompt', text: 'Load subscriptions.csv and the events table from the warehouse. Which columns have missing values?', count: 1, state: 'done', out: 'load' }),
    mk({ kind: 'prompt', text: 'Monthly churn over the last six months, split by plan. Chart it.', count: 2, state: 'done', out: 'churn',
      interp: 'Churned means <span class="val" tabindex="0">cancelled and not reactivated within 14 days</span>. Last six months is <span class="val tnum" tabindex="0">Apr 1 to Sep 30, 2026</span>.' }),
    mk({ kind: 'prompt', text: 'Why did @churn_by_plan spike for Pro in August? Check cancellation reasons and billing cycle.', count: 3, state: 'done', out: 'why' }),
    mk({ kind: 'prompt', text: 'List Pro users on monthly billing who downgraded to Starter after the price change and are still active.', pendingOut: 'winback',
      interp: 'After the price change means after <span class="val tnum" tabindex="0">Aug 4, 2026</span>. Still active means <span class="val" tabindex="0">logged in during the last 30 days</span>.' })
  ];
  var cellsEl = document.getElementById('cells');

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function hl(s) { return esc(s).replace(/@([a-z_][a-z0-9_]*)/gi, '<span class="r">@$1</span>') + (s.endsWith('\n') ? ' ' : ''); }
  function trunc(s, n) { s = s.replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n - 1) + '…' : s; }
  function inline(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<strong class="font-semibold text-ink">$1</strong>').replace(/`([^`]+)`/g, '<code class="ref">$1</code>').replace(/@([a-z_][a-z0-9_]*)/gi, '<span class="ref">@$1</span>'); }
  function md(t) {
    if (!t.trim()) return '<p class="text-[14px] text-faint">Empty note</p>';
    var out = [], para = [];
    function flush() { if (para.length) { out.push('<p class="max-w-[62ch] text-[14.5px] leading-[1.65] text-muted">' + inline(para.join(' ')) + '</p>'); para = []; } }
    t.split('\n').forEach(function (line) {
      var m = line.match(/^(#{1,3})\s+(.*)/);
      if (m) { flush(); out.push(m[1].length === 1 ? '<h1 class="text-[22px] font-semibold tracking-[-0.015em] text-ink">' + inline(m[2]) + '</h1>' : '<h2 class="text-[16px] font-semibold text-ink">' + inline(m[2]) + '</h2>'); }
      else if (!line.trim()) flush();
      else para.push(line);
    });
    flush();
    return '<div class="flex flex-col gap-2">' + out.join('') + '</div>';
  }
  function getOut(c) { return c.out === 'generic' ? c.gen : OUT[c.out]; }
  function idx(c) { return cells.indexOf(c); }
  function byId(id) { for (var i = 0; i < cells.length; i++) if (cells[i].id === id) return cells[i]; }

  // ============ Rendering ============
  function statusText(c) {
    if (c.kind !== 'prompt') return '';
    if (c.state === 'dirty') return '<span class="text-muted">edited</span>';
    if (c.state === 'stale') return '<span class="text-warn">out of date</span>';
    return '';
  }
  function editor(c, mono) {
    return '<div class="ed relative min-w-0 flex-1 ' + (mono ? 'font-mono text-[13.5px] leading-[1.7]' : 'text-[15px] leading-[1.6]') + ' text-ink">' +
      '<pre class="hl" aria-hidden="true">' + hl(c.text) + '</pre>' +
      '<textarea class="ta" spellcheck="false" rows="1" aria-label="' + (c.kind === 'md' ? 'Note' : 'Prompt') + '" placeholder="' +
      (c.kind === 'md' ? 'Write a note in Markdown' : 'Describe what you want to compute. Shift+Enter to run.') + '">' + esc(c.text) + '</textarea></div>';
  }
  function running(c) {
    var label = ['Writing code', 'Checking variables', 'Running'][c.step];
    if (c.step === 0 && c.codeEdited && !c.promptChanged) label = 'Using your code';
    return '<div class="mt-2 flex items-center gap-2 text-[13px] text-muted">' + I.spin + label + '</div>';
  }
  function output(c, o) {
    var views = o.views.concat([{ name: 'Code', code: true }]);
    if (c.tab >= views.length) c.tab = 0;
    var code = c.code != null ? esc(c.code) : o.code;
    return '<div class="out mt-3 transition-opacity' + (c.state === 'stale' ? ' opacity-40' : '') + '">' +
      '<div class="mb-2 flex items-center gap-3 text-[12px]">' +
      views.map(function (v, i) { return '<button class="tab ' + (i === c.tab ? 'text-ink' : 'text-faint hover:text-muted') + '" data-i="' + i + '">' + v.name + '</button>'; }).join('') +
      (c.codeEdited ? '<span class="text-faint">· your code</span>' : '') +
      '<span class="tnum ml-auto font-mono text-[11px] text-faint">' + o.secs + '</span></div>' +
      views.map(function (v, i) {
        var body = v.code
          ? '<pre class="scroll overflow-x-auto rounded-lg bg-raised p-3 font-mono text-[12.5px] leading-[1.7] text-ink"><code class="codeed" contenteditable="plaintext-only" spellcheck="false" aria-label="Generated code">' + code + '</code></pre>'
          : v.html;
        return '<div class="panel" data-i="' + i + '"' + (i === c.tab ? '' : ' hidden') + '>' + body + '</div>';
      }).join('') + '</div>';
  }
  function cellHTML(c) {
    var p = c.kind === 'prompt';
    var label = p ? (c.state === 'running' ? '[*]' : c.count != null ? '[' + c.count + ']' : '[ ]') : '';
    var gutter = p
      ? '<button data-act="run" class="group/run relative block h-6 w-9 text-left font-mono text-[11px] text-faint" aria-label="Run cell"><span class="group-hover/run:invisible">' + label + '</span><span class="absolute inset-0 hidden items-center text-go group-hover/run:flex">' + I.play + '</span></button>'
      : '';
    var head, body = '';
    if (p) {
      head = editor(c, false);
      if (c.interp && c.state !== 'running') body += '<p class="interp mt-1.5 max-w-[62ch] text-[13px] leading-[1.7] text-faint">' + c.interp + '</p>';
      if (c.state === 'running') body += running(c);
      else if (c.out) body += output(c, getOut(c));
    } else {
      head = c.editing ? editor(c, true) : '<div class="mdview min-w-0 flex-1 cursor-text">' + md(c.text) + '</div>';
    }
    return '<article class="cell group relative flex gap-2 py-3 pr-1" data-id="' + c.id + '">' +
      '<span class="selbar absolute bottom-3 left-[-10px] top-3 w-[2px] rounded-full"></span>' +
      '<div class="w-9 shrink-0 pt-[3px]">' + gutter + '</div>' +
      '<div class="min-w-0 flex-1">' +
        '<div class="flex items-start gap-3">' + head +
          '<div class="flex shrink-0 items-center gap-2 pt-0.5 text-[12px]">' +
            '<span class="status">' + statusText(c) + '</span>' +
            '<span class="acts flex items-center text-faint opacity-0 transition-opacity group-hover:opacity-100 group-focus-within:opacity-100 group-[.sel]:opacity-100">' +
              '<button data-act="up" class="rounded p-1 hover:bg-hover hover:text-ink" aria-label="Move up">' + I.up + '</button>' +
              '<button data-act="down" class="rounded p-1 hover:bg-hover hover:text-ink" aria-label="Move down">' + I.down + '</button>' +
              '<button data-act="del" class="rounded p-1 hover:bg-hover hover:text-ink" aria-label="Delete cell">' + I.trash + '</button>' +
            '</span>' +
          '</div>' +
        '</div>' + body +
      '</div></article>' +
      '<div class="adder group/add flex h-5 items-center gap-2 pl-11">' +
        '<div class="h-px flex-1 group-hover/add:bg-edge"></div>' +
        '<div class="flex gap-1 text-[11.5px] opacity-0 transition-opacity focus-within:opacity-100 group-hover/add:opacity-100">' +
          '<button data-add="prompt" class="flex items-center gap-1 rounded px-1.5 py-0.5 text-faint hover:bg-hover hover:text-ink">' + I.plus + 'Prompt</button>' +
          '<button data-add="md" class="flex items-center gap-1 rounded px-1.5 py-0.5 text-faint hover:bg-hover hover:text-ink">' + I.plus + 'Note</button>' +
        '</div><div class="h-px flex-1 group-hover/add:bg-edge"></div></div>';
  }

  function render(c) {
    var ae = document.activeElement, keep = c.el && c.el.contains(ae) && ae.classList.contains('ta'), pos = keep ? ae.selectionStart : 0;
    if (!c.el) c.el = document.createElement('div');
    c.el.innerHTML = cellHTML(c);
    if (selId === c.id) c.el.querySelector('.cell').classList.add('sel');
    bind(c);
    if (c.out && c.state !== 'running') { var o = getOut(c); if (o.after) o.after(c.el); }
    if (keep) { var ta = c.el.querySelector('.ta'); if (ta) { ta.focus(); ta.setSelectionRange(pos, pos); } }
  }
  function layout() { cells.forEach(function (c) { cellsEl.appendChild(c.el); }); }
  function markDirty(c) {
    if (c.kind === 'prompt' && c.state !== 'running' && (c.count != null || c.out)) c.state = 'dirty';
    var s = c.el.querySelector('.status'); if (s) s.innerHTML = statusText(c);
    sync();
  }

  function bind(c) {
    var el = c.el;
    el.querySelector('.cell').addEventListener('mousedown', function () { select(c); });
    var ta = el.querySelector('.ta'), mirror = el.querySelector('.hl');
    if (ta) {
      ta.addEventListener('input', function () {
        c.text = ta.value; mirror.innerHTML = hl(ta.value);
        if (c.kind === 'prompt') { c.promptChanged = true; markDirty(c); } else sync();
      });
      ta.addEventListener('focus', function () { select(c); });
      ta.addEventListener('keydown', function (e) { editorKeys(e, c); });
    }
    var mv = el.querySelector('.mdview');
    if (mv) mv.addEventListener('dblclick', function () { focusEditor(c); });
    el.querySelectorAll('[data-act]').forEach(function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var a = b.dataset.act;
        if (a === 'run') runCell(c); else if (a === 'up') move(c, -1); else if (a === 'down') move(c, 1); else if (a === 'del') del(c);
      });
    });
    el.querySelectorAll('[data-add]').forEach(function (b) { b.addEventListener('click', function () { insertAt(idx(c) + 1, b.dataset.add); }); });
    el.querySelectorAll('.tab').forEach(function (b) {
      b.addEventListener('click', function () {
        c.tab = +b.dataset.i;
        el.querySelectorAll('.tab').forEach(function (t) { var on = t === b; t.classList.toggle('text-ink', on); t.classList.toggle('text-faint', !on); });
        el.querySelectorAll('.panel').forEach(function (p) { p.hidden = +p.dataset.i !== c.tab; });
      });
    });
    var code = el.querySelector('.codeed');
    if (code) {
      code.addEventListener('input', function () { c.code = code.textContent; c.codeEdited = true; c.promptChanged = false; markDirty(c); });
      code.addEventListener('keydown', function (e) { if (e.key === 'Enter' && (e.shiftKey || e.metaKey || e.ctrlKey)) { e.preventDefault(); runCell(c); } });
    }
    el.querySelectorAll('.val').forEach(function (v) {
      var before = '';
      function edit() {
        if (v.isContentEditable) return;
        before = v.textContent; v.contentEditable = 'true'; v.focus();
        var r = document.createRange(); r.selectNodeContents(v); var s = getSelection(); s.removeAllRanges(); s.addRange(r);
      }
      v.addEventListener('click', edit);
      v.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); if (v.isContentEditable) v.blur(); else edit(); }
        if (e.key === 'Escape' && v.isContentEditable) { v.textContent = before; v.blur(); }
      });
      v.addEventListener('blur', function () {
        v.removeAttribute('contenteditable');
        if (v.textContent.trim() === before.trim()) return;
        c.interp = el.querySelector('.interp').innerHTML;
        c.promptChanged = true; markDirty(c);
      });
    });
  }
  function editorKeys(e, c) {
    if (e.key === 'Enter' && e.shiftKey) { e.preventDefault(); runAndAdvance(c); }
    else if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); runCell(c); }
    else if (e.key === 'Enter' && e.altKey) { e.preventDefault(); runCell(c); insertAt(idx(c) + 1, 'prompt'); }
    else if (e.key === 'Escape') { e.preventDefault(); e.target.blur(); if (c.kind === 'md' && c.editing && c.text.trim()) { c.editing = false; render(c); } }
  }

  // ============ Actions ============
  function select(c) {
    if (!c) return;
    selId = c.id;
    document.querySelectorAll('.cell').forEach(function (a) { a.classList.toggle('sel', a.dataset.id === c.id); });
    syncOutline();
  }
  function focusEditor(c) {
    if (c.kind === 'md' && !c.editing) { c.editing = true; render(c); }
    select(c);
    var ta = c.el.querySelector('.ta'); if (!ta) return;
    ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
    c.el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
  function insertAt(i, kind) {
    var n = mk({ kind: kind, text: '', editing: kind === 'md' });
    cells.splice(i, 0, n); render(n); layout(); sync(); focusEditor(n);
  }
  function move(c, d) {
    var i = idx(c), j = i + d;
    if (j < 0 || j >= cells.length) return;
    cells.splice(i, 1); cells.splice(j, 0, c); layout(); select(c); sync();
  }
  function del(c) {
    var i = idx(c);
    if (c._cancel) c._cancel();
    cells.splice(i, 1); c.el.remove();
    select(cells[Math.min(i, cells.length - 1)]); sync();
    toast('Cell deleted', function () { cells.splice(i, 0, c); layout(); select(c); sync(); });
  }
  function setKind(c, kind) {
    if (c.kind === kind) return;
    if (c._cancel) c._cancel();
    c.kind = kind; c.count = null; c.out = null; c.state = 'idle'; c.codeEdited = false; c.code = null; c.interp = null; c.editing = kind === 'md';
    render(c); select(c); sync();
  }
  function runAndAdvance(c) {
    runCell(c);
    var i = idx(c);
    if (i === cells.length - 1) insertAt(i + 1, 'prompt');
    else { select(cells[i + 1]); cells[i + 1].el.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); if (document.activeElement) document.activeElement.blur(); }
  }
  function genOut(c) {
    var name = 'result_' + c.count, cr = {}; cr[name] = 'simulated';
    return {
      secs: '0.9s', creates: cr,
      views: [{ name: 'Result', html: '<p class="max-w-[62ch] text-[14px] leading-[1.65] text-faint">The generated code would run here and its output would appear in this spot. Simulated in this draft.</p>' }],
      code: '<span class="c"># ' + esc(trunc(c.text, 72)) + '</span>\n' + name + ' = ...'
    };
  }
  function runCell(c, opts) {
    opts = opts || {};
    if (c.kind === 'md') { if (c.editing && c.text.trim()) { c.editing = false; render(c); sync(); } return Promise.resolve(); }
    if (!c.text.trim() || c.state === 'running') return Promise.resolve();
    return new Promise(function (resolve) {
      var prev = c.state;
      if (c.promptChanged) { c.codeEdited = false; c.code = null; }
      c.state = 'running'; c.step = opts.startAt || 0;
      render(c); sync();
      var durs = [500, 500, opts.last || 700];
      function next() { c._t = setTimeout(function () { c.step++; if (c.step >= 3) done(); else { render(c); next(); } }, durs[c.step]); }
      function done() {
        c._cancel = null; c.promptChanged = false;
        c.state = 'done'; c.count = ++execCount;
        if (!c.out) c.out = c.pendingOut || 'generic';
        if (c.out === 'generic') c.gen = genOut(c);
        cells.slice(idx(c) + 1).forEach(function (d) { if (d.kind === 'prompt' && d.state === 'done') { d.state = 'stale'; render(d); } });
        render(c); sync(); resolve();
      }
      c._cancel = function () { clearTimeout(c._t); c._cancel = null; c.state = c.out ? (prev === 'running' ? 'dirty' : prev) : 'idle'; render(c); sync(); resolve(); };
      next();
    });
  }
  async function runAll() {
    stopFlag = false;
    for (var i = 0; i < cells.length; i++) {
      if (stopFlag) break;
      if (cells[i].kind === 'prompt' && cells[i].text.trim()) select(cells[i]);
      await runCell(cells[i]);
    }
  }
  function stopAll() { stopFlag = true; cells.forEach(function (c) { if (c._cancel) c._cancel(); }); }
  function restart() {
    stopAll(); execCount = 0;
    cells.forEach(function (c) { if (c.kind === 'prompt') { c.count = null; if (c.out) c.state = 'stale'; render(c); } });
    sync(); toast('Kernel restarted');
  }

  // ============ Outline, variables, kernel ============
  function syncOutline() {
    var ol = document.getElementById('outline');
    ol.innerHTML = cells.map(function (c) {
      var p = c.kind === 'prompt';
      var title = p ? (c.text.trim() ? trunc(c.text, 48) : 'Empty prompt') : (trunc(c.text.split('\n')[0].replace(/^#+\s*/, ''), 48) || 'Empty note');
      var on = c.id === selId;
      var dot = c.state === 'stale' ? 'bg-warn' : c.state === 'dirty' ? 'bg-muted' : c.state === 'running' ? 'bg-go' : 'bg-transparent';
      return '<li><button data-go="' + c.id + '" class="flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-left ' + (on ? 'bg-hover text-ink' : 'text-muted hover:text-ink') + '">' +
        '<span class="truncate' + (p ? '' : ' font-medium') + '">' + esc(title) + '</span><span class="ml-auto h-1.5 w-1.5 shrink-0 rounded-full ' + dot + '"></span></button></li>';
    }).join('');
    ol.querySelectorAll('[data-go]').forEach(function (b) {
      b.addEventListener('click', function () { var c = byId(b.dataset.go); select(c); c.el.scrollIntoView({ block: 'center', behavior: 'smooth' }); });
    });
  }
  function sync() {
    syncOutline();
    var run = 0, vars = {};
    cells.forEach(function (c) {
      if (c.state === 'running') run++;
      if (c.kind === 'prompt' && c.count != null && c.out) { var cr = getOut(c).creates; for (var k in cr) vars[k] = cr[k]; }
    });
    var names = Object.keys(vars);
    document.getElementById('vars').innerHTML = names.length ? names.map(function (n) {
      return '<li class="flex items-baseline justify-between gap-2 px-2 py-1"><span class="truncate text-[#D7A2F0]">' + n + '</span><span class="tnum shrink-0 text-faint">' + vars[n] + '</span></li>';
    }).join('') : '<li class="px-2 py-1 font-sans text-[12.5px] text-faint">None yet</li>';
    var busy = run > 0;
    document.getElementById('kernelState').textContent = 'Python 3.12 · ' + (busy ? 'running' : 'idle');
    document.getElementById('kernelDot').className = 'h-1.5 w-1.5 rounded-full ' + (busy ? 'bg-warn' : 'bg-go');
    document.getElementById('stopBtn').classList.toggle('hidden', !busy);
  }

  var toastEl = document.getElementById('toast'), toastT;
  function toast(msg, undo) {
    toastEl.innerHTML = '<span>' + esc(msg) + '</span>' + (undo ? '<button class="font-medium text-muted hover:text-ink">Undo</button>' : '');
    toastEl.classList.remove('opacity-0', 'pointer-events-none');
    if (undo) toastEl.querySelector('button').onclick = function () { undo(); hide(); };
    clearTimeout(toastT); toastT = setTimeout(hide, 4000);
    function hide() { toastEl.classList.add('opacity-0', 'pointer-events-none'); }
  }

  // ============ Controls ============
  document.getElementById('runAllBtn').addEventListener('click', runAll);
  document.getElementById('stopBtn').addEventListener('click', stopAll);
  document.getElementById('restartBtn').addEventListener('click', restart);
  document.getElementById('appendBtn').addEventListener('click', function () { insertAt(cells.length, 'prompt'); });
  var sidebar = document.getElementById('sidebar'), sbBtn = document.getElementById('sidebarToggle');
  sbBtn.addEventListener('click', function () {
    var open = sidebar.classList.toggle('hidden') === false;
    sidebar.classList.toggle('flex', open); sbBtn.setAttribute('aria-expanded', open);
  });

  // Command mode, Jupyter style: A/B insert, M/Y note/prompt, D D delete, arrows move, Enter edits
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t.closest && t.closest('textarea, input, [contenteditable]')) return;
    if (t.closest && t.closest('button, a') && (e.key === 'Enter' || e.key === ' ')) return;
    var c = byId(selId); if (!c) return;
    var k = e.key, i = idx(c);
    if (k === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); runCell(c); }
    else if (k === 'Enter' && e.shiftKey) { e.preventDefault(); runAndAdvance(c); }
    else if (e.metaKey || e.ctrlKey || e.altKey) return;
    else if (k === 'Enter') { e.preventDefault(); focusEditor(c); }
    else if (k === 'a') insertAt(i, 'prompt');
    else if (k === 'b') insertAt(i + 1, 'prompt');
    else if (k === 'm') setKind(c, 'md');
    else if (k === 'y') setKind(c, 'prompt');
    else if (k === 'ArrowUp' || k === 'k') { e.preventDefault(); if (i > 0) { select(cells[i - 1]); cells[i - 1].el.scrollIntoView({ block: 'nearest' }); } }
    else if (k === 'ArrowDown' || k === 'j') { e.preventDefault(); if (i < cells.length - 1) { select(cells[i + 1]); cells[i + 1].el.scrollIntoView({ block: 'nearest' }); } }
    else if (k === 'd') { if (Date.now() - lastD < 500) { del(c); lastD = 0; } else lastD = Date.now(); }
  });

  // ============ Boot ============
  cells.forEach(render); layout(); sync();
  runCell(cells[4], { startAt: 2, last: 3000 });
})();
</script>
