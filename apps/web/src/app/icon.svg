<svg xmlns="http://www.w3.org/2000/svg" viewBox="-1 -0.5 8 8" shape-rendering="crispEdges">
  <!-- The mark: sixteen squares on a 6 by 7 grid, dark on light tabs and light on dark ones -->
  <style>
    rect { fill: #1d1d1b }
    @media (prefers-color-scheme: dark) { rect { fill: #ecebe7 } }
  </style>
  <rect x="1" y="0" width="1" height="1" /><rect x="3" y="0" width="1" height="1" />
  <rect x="0" y="1" width="1" height="1" /><rect x="2" y="1" width="1" height="1" /><rect x="4" y="1" width="1" height="1" />
  <rect x="1" y="2" width="1" height="1" /><rect x="5" y="2" width="1" height="1" />
  <rect x="0" y="3" width="1" height="1" /><rect x="5" y="3" width="1" height="1" />
  <rect x="1" y="4" width="1" height="1" /><rect x="5" y="4" width="1" height="1" />
  <rect x="0" y="5" width="1" height="1" /><rect x="2" y="5" width="1" height="1" /><rect x="4" y="5" width="1" height="1" />
  <rect x="1" y="6" width="1" height="1" /><rect x="3" y="6" width="1" height="1" />
</svg>
