  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  next: 16.4.3
  react: ^19.3.1
  react-dom: ^19.3.1
  tailwindcss: ^4.3.3
  typescript: ~6.0.3
  vitest: ^5.0.5
