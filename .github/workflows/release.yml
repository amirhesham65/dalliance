name: Release

# Push a tag that matches apps/desktop's version, e.g. v0.1.0, to build Dalliance.dmg
# and publish it to the Vercel Blob store the website's Download button points at.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  dmg:
    name: Build and publish Dalliance.dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the app version
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match apps/desktop version $version" >&2
            exit 1
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # The same checks as CI, so a tag never ships code that fails them.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install pandas numpy matplotlib 'ipython>=8,<10'
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test
      - run: pnpm --filter @dalliance/desktop dist:mac --publish never
      # The website's /download points at Dalliance.dmg in the Vercel Blob store. Each release also keeps its own copy
      - name: Upload the installer
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: node apps/desktop/scripts/upload-release.mjs "$GITHUB_REF_NAME"
      - name: Record the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" apps/desktop/release/Dalliance.dmg --title "Dalliance $GITHUB_REF_NAME" --generate-notes
