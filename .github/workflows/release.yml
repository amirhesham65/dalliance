name: Release

# Push a tag that matches apps/desktop's version, e.g. v0.1.0, to build Dalliance.dmg
# and publish it to amirhesham65/dalliance-releases, where the website's Download button points.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  dmg:
    name: Build and publish Dalliance.dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag matches the app version
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match apps/desktop version $version" >&2
            exit 1
          fi
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # The same checks as CI, so a tag never ships code that fails them.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install pandas numpy matplotlib 'ipython>=8,<10'
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run lint typecheck test
      - run: pnpm --filter @dalliance/desktop dist:mac --publish never
      # Downloads come from amirhesham65/dalliance-releases, which holds only
      # installers. The website's /download points at its latest release, and the app reads latest-mac.yml there to
      # tell a newer version is out. The zip and its blockmap are what electron-updater will download once releases
      # are signed. See docs/releasing.md
      - name: Publish the installer
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        working-directory: apps/desktop/release
        run: gh release create "$GITHUB_REF_NAME" Dalliance.dmg Dalliance.zip Dalliance.zip.blockmap latest-mac.yml --repo amirhesham65/dalliance-releases --title "Dalliance ${GITHUB_REF_NAME#v}" --notes-file "$GITHUB_WORKSPACE/.github/release-notes.md"
      - name: Record the release here
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "Dalliance ${GITHUB_REF_NAME#v}" --generate-notes
